name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud
      # Run this command as early as possible, before dependencies are installed
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      # pnpm 버전은 package.json의 packageManager 필드에서 읽음
      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - run: pnpm dlx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      # Cache node_modules
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'pnpm'

      # spring-server의 Gradle toolchain(Java 25)용 JDK
      - uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '25'
          cache: 'gradle'

      - run: pnpm install --frozen-lockfile

      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - run: pnpm exec nx record -- nx format:check --base="remotes/origin/main"
      - run: pnpm exec nx run-many -t lint test typecheck export e2e
      # mobile의 build는 EAS 클라우드 빌드(Expo 계정 필요)라 CI에서 제외하고, 위의 export로 번들링만 검증
      - run: pnpm exec nx run-many -t build --exclude=@org/rn-mobile
      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: pnpm exec nx fix-ci
        if: always()
