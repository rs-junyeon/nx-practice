import static dev.nx.gradle.Groovy.nx

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nxpractice'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.1.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'openapi'
	}
}

// OpenAPI 명세를 build/openapi/openapi.json으로 생성 (packages/api-client가 TS 타입 생성에 사용)
tasks.register('generateOpenApi', Test) {
	group = 'documentation'
	description = 'Generates the OpenAPI spec without starting a server.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'openapi'
	}
	def outputFile = layout.buildDirectory.file('openapi/openapi.json')
	outputs.file(outputFile)
	systemProperty 'openapi.output', outputFile.get().asFile.absolutePath
}

nx(project) {
	it.set 'name', '@org/spring-server'
}
